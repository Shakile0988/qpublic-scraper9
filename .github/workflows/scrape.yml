name: scrape

on:
  workflow_dispatch:
    inputs:
      county_name:
        description: "County name (e.g. Hall County)"
        required: true
      state_code:
        description: "State code (e.g. GA)"
        required: true
      parcel_id:
        description: "Parcel ID"
        required: true
      webhook_url:
        description: "n8n / webhook URL to POST result to"
        required: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system deps (Xvfb + fonts for virtual display)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Download Camoufox browser
        run: python -m camoufox fetch

      - name: Run scraper
        env:
          COUNTY_NAME: ${{ github.event.inputs.county_name }}
          STATE_CODE: ${{ github.event.inputs.state_code }}
          PARCEL_ID: ${{ github.event.inputs.parcel_id }}
          WEBHOOK_URL: ${{ github.event.inputs.webhook_url }}
        run: python scraper.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: debug-files
          path: |
            debug.png
            debug.html
            report_debug.html
            output.json
          if-no-files-found: ignore
